[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brand-visibility"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3", "numpy>=1.26,<3", "streamlit>=1.36,<2",
  "plotly>=5.22,<7", "requests>=2.31,<3", "python-dotenv>=1.0,<2"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
